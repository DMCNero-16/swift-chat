name: Build for Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
  pull-requests: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Windows SDK 10.0.19041.0
        shell: pwsh
        run: |
          $sdkDir = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.19041.0"
          if (-not (Test-Path $sdkDir)) {
            Write-Host "Installing SDK 10.0.19041.0..."
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?linkid=2120843" -OutFile "$env:TEMP\winsdksetup.exe"
            Start-Process -Wait -FilePath "$env:TEMP\winsdksetup.exe" -ArgumentList "/features + /quiet /norestart"
          }
      - name: Configure npm
        run: npm config set legacy-peer-deps true
      - name: Install dependencies
        run: |
          cd react-native
          npm install
      - name: Initialize react-native-windows
        run: |
          cd react-native
          npx react-native-windows-init --version 0.74.0 --overwrite --projectName SwiftChat --namespace SwiftChat
      - name: Patch appxmanifest MinVersion
        shell: pwsh
        run: |
          $manifest = 'react-native/windows/SwiftChat/Package.appxmanifest'
          (Get-Content $manifest) -replace 'MinVersion="10.0.16299.0"', 'MinVersion="10.0.17763.0"' | Set-Content $manifest
      - name: Create Windows entry stubs for platform-split modules
        shell: pwsh
        run: |
          # Find all .ios.js/.ios.ts files that have .android counterparts but no .windows or generic version
          # These will fail Metro resolution on Windows platform
          $nmDir = 'react-native/node_modules'
          Get-ChildItem -Path $nmDir -Recurse -File -Include '*.ios.js','*.ios.ts','*.ios.tsx' | ForEach-Object {
            $iosFile = $_.FullName
            $dir = $_.DirectoryName
            $name = $_.Name
            # Extract base name and extension: foo.ios.js -> foo, js
            if ($name -match '^(.+)\.ios\.(js|ts|tsx)$') {
              $base = $Matches[1]
              $ext = $Matches[2]
              $androidFile = Join-Path $dir "$base.android.$ext"
              $genericFile = Join-Path $dir "$base.$ext"
              $windowsFile = Join-Path $dir "$base.windows.js"
              $nativeFile = Join-Path $dir "$base.native.$ext"
              # Only create stub if android exists but no generic/windows/native version
              if ((Test-Path $androidFile) -and -not (Test-Path $genericFile) -and -not (Test-Path $windowsFile) -and -not (Test-Path $nativeFile)) {
                # Skip react-native and react-native-windows internal files
                $rel = $iosFile.Substring($nmDir.Length).TrimStart('\', '/')
                if ($rel -notmatch '^react-native[\\\/]' -and $rel -notmatch '^react-native-windows[\\\/]' -and $rel -notmatch '^@react-native[\\\/]') {
                  # Copy the iOS version as Windows stub (best effort compatibility)
                  Copy-Item $iosFile $windowsFile
                  Write-Host "Created stub: $windowsFile (copied from ios)"
                }
              }
            }
          }
      - name: Run autolink
        run: |
          cd react-native
          npx react-native autolink-windows --sln windows/swift-chat.sln --proj windows/SwiftChat/SwiftChat.vcxproj
      - name: Restore NuGet packages (after autolink)
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\amd64\MSBuild.exe
          & $msbuild react-native/windows/SwiftChat.sln /t:Restore /p:RestoreProjectStyle=PackagesConfig /p:RestorePackagesConfig=true /p:Platform=x64 /p:Configuration=Release
      - name: Build Windows app (Release)
        run: |
          cd react-native
          npx react-native run-windows --release --arch x64 --no-launch --no-autolink
      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftChat-Windows-MSIX
          path: react-native/windows/SwiftChat/AppPackages/
