name: Build for Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
  pull-requests: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Windows SDK 10.0.19041.0
        shell: pwsh
        run: |
          # RNW 0.74 requires SDK 10.0.19041.0 which may not be on the runner
          $sdkDir = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.19041.0"
          if (-not (Test-Path $sdkDir)) {
            Write-Host "SDK 10.0.19041.0 not found, installing..."
            $installerUrl = "https://go.microsoft.com/fwlink/p/?linkid=2120843"
            Invoke-WebRequest -Uri $installerUrl -OutFile "$env:TEMP\winsdksetup.exe"
            Start-Process -Wait -FilePath "$env:TEMP\winsdksetup.exe" -ArgumentList "/features + /quiet /norestart"
            Write-Host "SDK installed."
          } else {
            Write-Host "SDK 10.0.19041.0 already available."
          }
      - name: Configure npm
        run: npm config set legacy-peer-deps true
      - name: Install dependencies
        run: |
          cd react-native
          npm install
      - name: Initialize react-native-windows
        run: |
          cd react-native
          npx react-native-windows-init --version 0.74.0 --overwrite
      - name: Patch appxmanifest MinVersion
        shell: pwsh
        run: |
          $manifest = 'react-native/windows/swift-chat/Package.appxmanifest'
          (Get-Content $manifest) -replace 'MinVersion="10.0.16299.0"', 'MinVersion="10.0.17763.0"' | Set-Content $manifest
      - name: Run autolink
        run: |
          cd react-native
          npx react-native autolink-windows --sln windows/swift-chat.sln --proj windows/swift-chat/swift-chat.vcxproj
      - name: Restore NuGet packages (after autolink)
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\amd64\MSBuild.exe
          & $msbuild react-native/windows/swift-chat.sln /t:Restore /p:RestoreProjectStyle=PackagesConfig /p:RestorePackagesConfig=true /p:Platform=x64 /p:Configuration=Release
      - name: Build Windows app (Release)
        run: |
          cd react-native
          npx react-native run-windows --release --arch x64 --no-launch --no-autolink
      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftChat-Windows-MSIX
          path: react-native/windows/SwiftChat/AppPackages/**/*.msix
