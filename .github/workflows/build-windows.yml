name: Build for Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
  pull-requests: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Windows SDK 10.0.19041.0
        shell: pwsh
        run: |
          $sdkDir = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.19041.0"
          if (-not (Test-Path $sdkDir)) {
            Write-Host "Installing SDK 10.0.19041.0..."
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?linkid=2120843" -OutFile "$env:TEMP\winsdksetup.exe"
            Start-Process -Wait -FilePath "$env:TEMP\winsdksetup.exe" -ArgumentList "/features + /quiet /norestart"
          }
      - name: Configure npm
        run: npm config set legacy-peer-deps true
      - name: Install dependencies
        run: |
          cd react-native
          npm install
      - name: Initialize react-native-windows
        run: |
          cd react-native
          npx react-native-windows-init --version 0.74.0 --overwrite --namespace SwiftChat
      - name: Patch appxmanifest MinVersion
        shell: pwsh
        run: |
          $manifest = 'react-native/windows/swift-chat/Package.appxmanifest'
          (Get-Content $manifest) -replace 'MinVersion="10.0.16299.0"', 'MinVersion="10.0.17763.0"' | Set-Content $manifest
      - name: Create Windows entry stubs for platform-split modules
        shell: pwsh
        run: |
          $nmDir = 'react-native/node_modules'
          Get-ChildItem -Path $nmDir -Recurse -File -Include '*.ios.js','*.ios.ts','*.ios.tsx' | ForEach-Object {
            $iosFile = $_.FullName
            $dir = $_.DirectoryName
            $name = $_.Name
            if ($name -match '^(.+)\.ios\.(js|ts|tsx)$') {
              $base = $Matches[1]
              $ext = $Matches[2]
              $androidFile = Join-Path $dir "$base.android.$ext"
              $genericFile = Join-Path $dir "$base.$ext"
              $windowsFile = Join-Path $dir "$base.windows.js"
              $nativeFile = Join-Path $dir "$base.native.$ext"
              if ((Test-Path $androidFile) -and -not (Test-Path $genericFile) -and -not (Test-Path $windowsFile) -and -not (Test-Path $nativeFile)) {
                $rel = $iosFile.Substring($nmDir.Length).TrimStart('\', '/')
                if ($rel -notmatch '^react-native[\\\/]' -and $rel -notmatch '^react-native-windows[\\\/]' -and $rel -notmatch '^@react-native[\\\/]') {
                  Copy-Item $iosFile $windowsFile
                  Write-Host "Created stub: $windowsFile (copied from ios)"
                }
              }
            }
          }
      - name: Run autolink
        run: |
          cd react-native
          npx react-native autolink-windows --sln windows/swift-chat.sln --proj windows/swift-chat/swift-chat.vcxproj
      - name: Restore NuGet packages (after autolink)
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\amd64\MSBuild.exe
          & $msbuild react-native/windows/swift-chat.sln /t:Restore /p:RestoreProjectStyle=PackagesConfig /p:RestorePackagesConfig=true /p:Platform=x64 /p:Configuration=Release
      - name: Build Windows app (Release)
        run: |
          cd react-native
          npx react-native run-windows --release --arch x64 --no-launch --no-deploy --no-autolink
      - name: Bundle VC++ runtime and create installer
        shell: pwsh
        run: |
          $buildDir = 'react-native/windows/x64/Release/swift-chat'
          $distDir = 'dist/SwiftChat'
          New-Item -ItemType Directory -Path $distDir -Force

          # Copy build output
          Copy-Item "$buildDir\*" $distDir -Recurse

          # Copy UWP VC++ runtime DLLs (*_app.dll)
          # These are from VCLibs UWP framework, not regular VC++ Redistributable
          $vclibsDir = Get-ChildItem "C:\Program Files (x86)\Microsoft SDKs\Windows Kits\10\ExtensionSDKs\Microsoft.VCLibs\14.0\Appx\Retail\x64" -ErrorAction SilentlyContinue
          if (-not $vclibsDir) {
            # Alternative: find from VS installation
            $vclibsDir = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise" -Recurse -Filter "vcruntime140_app.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
            if ($vclibsDir) { $vclibsDir = $vclibsDir.DirectoryName }
          }
          if (-not $vclibsDir -or -not (Test-Path $vclibsDir)) {
            # Search broadly
            $found = Get-ChildItem "C:\Program Files*" -Recurse -Filter "vcruntime140_app.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' -and $_.FullName -match 'Retail' } | Select-Object -First 1
            if ($found) { $vclibsDir = $found.DirectoryName }
          }
          if ($vclibsDir -and (Test-Path $vclibsDir)) {
            Copy-Item "$vclibsDir\vcruntime140_app.dll" $distDir -ErrorAction SilentlyContinue
            Copy-Item "$vclibsDir\vcruntime140_1_app.dll" $distDir -ErrorAction SilentlyContinue
            Copy-Item "$vclibsDir\msvcp140_app.dll" $distDir -ErrorAction SilentlyContinue
            Write-Host "Copied UWP VCLibs from: $vclibsDir"
          } else {
            Write-Host "WARNING: Could not find VCLibs _app.dll files"
          }
          # Also copy regular VC++ runtime as fallback
          $vcToolsDir = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find VC\Redist\MSVC\*\x64\*.CRT
          if ($vcToolsDir) {
            $crtDir = $vcToolsDir | Select-Object -First 1
            Copy-Item "$crtDir\vcruntime140.dll" $distDir -ErrorAction SilentlyContinue
            Copy-Item "$crtDir\vcruntime140_1.dll" $distDir -ErrorAction SilentlyContinue
            Copy-Item "$crtDir\msvcp140.dll" $distDir -ErrorAction SilentlyContinue
            Write-Host "Copied VC++ CRT from: $crtDir"
          }

          # Create Inno Setup script
          $issContent = @"
          [Setup]
          AppName=SwiftChat
          AppVersion=2.7.0
          DefaultDirName={autopf}\SwiftChat
          DefaultGroupName=SwiftChat
          OutputDir=..\installer
          OutputBaseFilename=SwiftChat-Setup-x64
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\swift-chat.exe

          [Files]
          Source: "*"; DestDir: "{app}"; Flags: recursesubdirs

          [Icons]
          Name: "{group}\SwiftChat"; Filename: "{app}\swift-chat.exe"
          Name: "{autodesktop}\SwiftChat"; Filename: "{app}\swift-chat.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"

          [Run]
          Filename: "{app}\swift-chat.exe"; Description: "Launch SwiftChat"; Flags: nowait postinstall skipifsilent
          "@

          Set-Content "$distDir\setup.iss" $issContent
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "$distDir\setup.iss"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SwiftChat-Windows-Setup
          path: dist/installer/SwiftChat-Setup-x64.exe
