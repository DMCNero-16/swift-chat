name: Build for Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
  pull-requests: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Configure npm
        run: npm config set legacy-peer-deps true
      - name: Install dependencies
        run: |
          cd react-native
          npm install
      - name: Initialize react-native-windows
        run: |
          cd react-native
          npx react-native-windows-init --version 0.74.0 --overwrite
      - name: Patch SDK versions for compatibility
        shell: pwsh
        run: |
          # 1. Patch appxmanifest MinVersion for document-picker
          $manifest = 'react-native/windows/swift-chat/Package.appxmanifest'
          (Get-Content $manifest) -replace 'MinVersion="10.0.16299.0"', 'MinVersion="10.0.17763.0"' | Set-Content $manifest

          # 2. Patch .csproj TargetPlatformMinVersion for document-picker
          Get-ChildItem -Path react-native/node_modules/react-native-document-picker -Recurse -Filter '*.csproj' | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match 'TargetPlatformMinVersion.*10\.0\.16299') {
              $content -replace '(<TargetPlatformMinVersion>)10\.0\.16299\.0(</TargetPlatformMinVersion>)', '${1}10.0.17763.0${2}' | Set-Content $_.FullName
              Write-Host "Patched: $($_.FullName)"
            }
          }

          # 3. Retarget SDK in the central RNW props file to match available SDK on runner
          $sdkDir = "C:\Program Files (x86)\Windows Kits\10\Include"
          $available = Get-ChildItem $sdkDir -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | ForEach-Object { $_.Name }
          Write-Host "Available SDKs: $($available -join ', ')"

          $propsFile = 'react-native/node_modules/react-native-windows/PropertySheets/External/Microsoft.ReactNative.WindowsSdk.Default.props'
          if ($available -notcontains '10.0.19041.0') {
            $target = ($available | Where-Object { [version]$_ -ge [version]'10.0.19041.0' } | Sort-Object { [version]$_ } | Select-Object -First 1)
            if (-not $target) { $target = ($available | Sort-Object { [version]$_ } | Select-Object -Last 1) }
            Write-Host "Retargeting vcxproj SDK from 10.0.19041.0 to $target (keeping csproj at 10.0.19041.0)"
            # Only replace in the vcxproj PropertyGroup (line with WindowsTargetPlatformVersion), not csproj (TargetPlatformVersion)
            $content = Get-Content $propsFile -Raw
            $content = $content -replace '(<WindowsTargetPlatformVersion[^>]*>)10\.0\.19041\.0(</WindowsTargetPlatformVersion>)', "`${1}$target`${2}"
            Set-Content $propsFile $content
          } else {
            Write-Host "SDK 10.0.19041.0 is available, no retargeting needed"
          }
      - name: Run autolink
        run: |
          cd react-native
          npx react-native autolink-windows --sln windows/swift-chat.sln --proj windows/swift-chat/swift-chat.vcxproj
      - name: Restore NuGet packages (after autolink)
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\amd64\MSBuild.exe
          & $msbuild react-native/windows/swift-chat.sln /t:Restore /p:RestoreProjectStyle=PackagesConfig /p:RestorePackagesConfig=true /p:Platform=x64 /p:Configuration=Release
      - name: Build Windows app (Release)
        run: |
          cd react-native
          npx react-native run-windows --release --arch x64 --no-launch --no-autolink
      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftChat-Windows-MSIX
          path: react-native/windows/SwiftChat/AppPackages/**/*.msix
