name: Release Next Version
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Version'
        required: true
        type: string
      release_code:
        description: 'Release Version Code'
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
env:
  NEW_VERSION: ${{ github.event.inputs.release_tag }}
  NEW_VERSION_CODE: ${{ github.event.inputs.release_code }}
jobs:
  release-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PROJECT_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Modify for next release
        run: |
          cd react-native
          chmod +x release.sh
          ./release.sh ${{ env.NEW_VERSION }} ${{ env.NEW_VERSION_CODE }}
          npm i --legacy-peer-deps
          cd ..
          git diff
          git add .
          git config user.name '${{ vars.USER_NAME }}'
          git config user.email '${{ vars.USER_EMAIL }}'
          git commit -m 'release: SwiftChat v${{ env.NEW_VERSION }}'
          git push
          git tag ${{ env.NEW_VERSION }}
          git push origin ${{ env.NEW_VERSION }}
      - name: Prepare release file
        run: |
          cd react-native/android
          ./gradlew assembleRelease
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: react-native/android/app/build/outputs/apk/release/*.apk

  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Configure npm
        run: npm config set legacy-peer-deps true
      - name: Install dependencies
        run: |
          cd react-native
          npm install
      - name: Initialize react-native-windows
        run: |
          cd react-native
          npx react-native-windows-init --version 0.74.0 --overwrite
      - name: Set minimum Windows SDK target
        shell: pwsh
        run: |
          $manifest = 'react-native/windows/swift-chat/Package.appxmanifest'
          (Get-Content $manifest) -replace 'MinVersion="10.0.16299.0"', 'MinVersion="10.0.17763.0"' | Set-Content $manifest
          Get-ChildItem -Path react-native/windows, react-native/node_modules -Recurse -Filter '*.csproj' | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match '10\.0\.16299') {
              $content -replace '10\.0\.16299', '10.0.17763' | Set-Content $_.FullName
              Write-Host "Updated: $($_.FullName)"
            }
          }
          Get-ChildItem -Path react-native/windows, react-native/node_modules -Recurse -Filter '*.vcxproj' | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match '10\.0\.16299') {
              $content -replace '10\.0\.16299', '10.0.17763' | Set-Content $_.FullName
              Write-Host "Updated: $($_.FullName)"
            }
          }
      - name: Build Windows MSIX
        run: |
          cd react-native
          npx react-native run-windows --release --arch x64 --no-launch
      - name: Upload Windows MSIX
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: react-native/windows/SwiftChat/AppPackages/**/*.msix

  create-release:
    needs: [release-android, release-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android
      - name: Download Windows MSIX
        uses: actions/download-artifact@v4
        with:
          name: windows-msix
          path: artifacts/windows
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "SwiftChat v${{ env.NEW_VERSION }}"
          files: |
            artifacts/android/*.apk
            artifacts/windows/*.msix
          tag_name: "${{ env.NEW_VERSION }}"
          prerelease: true
          generate_release_notes: true
