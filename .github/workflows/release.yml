name: Release Next Version
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Version'
        required: true
        type: string
      release_code:
        description: 'Release Version Code'
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
env:
  NEW_VERSION: ${{ github.event.inputs.release_tag }}
  NEW_VERSION_CODE: ${{ github.event.inputs.release_code }}
jobs:
  release-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PROJECT_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Modify for next release
        run: |
          cd react-native
          chmod +x release.sh
          ./release.sh ${{ env.NEW_VERSION }} ${{ env.NEW_VERSION_CODE }}
          npm i --legacy-peer-deps
          cd ..
          git diff
          git add .
          git config user.name '${{ vars.USER_NAME }}'
          git config user.email '${{ vars.USER_EMAIL }}'
          git commit -m 'release: SwiftChat v${{ env.NEW_VERSION }}'
          git push
          git tag ${{ env.NEW_VERSION }}
          git push origin ${{ env.NEW_VERSION }}
      - name: Prepare release file
        run: |
          cd react-native/android
          ./gradlew assembleRelease
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: react-native/android/app/build/outputs/apk/release/*.apk

  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Windows SDK 10.0.19041.0
        shell: pwsh
        run: |
          $sdkDir = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.19041.0"
          if (-not (Test-Path $sdkDir)) {
            Write-Host "SDK 10.0.19041.0 not found, installing..."
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?linkid=2120843" -OutFile "$env:TEMP\winsdksetup.exe"
            Start-Process -Wait -FilePath "$env:TEMP\winsdksetup.exe" -ArgumentList "/features + /quiet /norestart"
            Write-Host "SDK installed."
          }
      - name: Configure npm
        run: npm config set legacy-peer-deps true
      - name: Install dependencies
        run: |
          cd react-native
          npm install
      - name: Initialize react-native-windows
        run: |
          cd react-native
          npx react-native-windows-init --version 0.74.0 --overwrite --namespace SwiftChat
      - name: Patch appxmanifest MinVersion
        shell: pwsh
        run: |
          $manifest = 'react-native/windows/swift-chat/Package.appxmanifest'
          (Get-Content $manifest) -replace 'MinVersion="10.0.16299.0"', 'MinVersion="10.0.17763.0"' | Set-Content $manifest
      - name: Create Windows entry stubs for platform-split modules
        shell: pwsh
        run: |
          $nmDir = 'react-native/node_modules'
          Get-ChildItem -Path $nmDir -Recurse -File -Include '*.ios.js','*.ios.ts','*.ios.tsx' | ForEach-Object {
            $iosFile = $_.FullName
            $dir = $_.DirectoryName
            $name = $_.Name
            if ($name -match '^(.+)\.ios\.(js|ts|tsx)$') {
              $base = $Matches[1]
              $ext = $Matches[2]
              $androidFile = Join-Path $dir "$base.android.$ext"
              $genericFile = Join-Path $dir "$base.$ext"
              $windowsFile = Join-Path $dir "$base.windows.js"
              $nativeFile = Join-Path $dir "$base.native.$ext"
              if ((Test-Path $androidFile) -and -not (Test-Path $genericFile) -and -not (Test-Path $windowsFile) -and -not (Test-Path $nativeFile)) {
                $rel = $iosFile.Substring($nmDir.Length).TrimStart('\', '/')
                if ($rel -notmatch '^react-native[\\\/]' -and $rel -notmatch '^react-native-windows[\\\/]' -and $rel -notmatch '^@react-native[\\\/]') {
                  Copy-Item $iosFile $windowsFile
                  Write-Host "Created stub: $windowsFile"
                }
              }
            }
          }
      - name: Run autolink
        run: |
          cd react-native
          npx react-native autolink-windows --sln windows/swift-chat.sln --proj windows/swift-chat/swift-chat.vcxproj
      - name: Restore NuGet packages (after autolink)
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\amd64\MSBuild.exe
          & $msbuild react-native/windows/swift-chat.sln /t:Restore /p:RestoreProjectStyle=PackagesConfig /p:RestorePackagesConfig=true /p:Platform=x64 /p:Configuration=Release
      - name: Build Windows MSIX
        run: |
          cd react-native
          npx react-native run-windows --release --arch x64 --no-launch --no-autolink
      - name: Upload Windows MSIX
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: react-native/windows/swift-chat/AppPackages/

  create-release:
    needs: [release-android, release-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android
      - name: Download Windows MSIX
        uses: actions/download-artifact@v4
        with:
          name: windows-msix
          path: artifacts/windows
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "SwiftChat v${{ env.NEW_VERSION }}"
          files: |
            artifacts/android/*.apk
            artifacts/windows/*.msix
          tag_name: "${{ env.NEW_VERSION }}"
          prerelease: true
          generate_release_notes: true
